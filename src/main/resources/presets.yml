catalogs:
  standard:
    source: defaults

presets:
  balanced:
    description: "The standard Hampta Shop catalog and balanced auction settings."
    catalog: standard
    buy-price-multiplier: 1.0
    sell-price-multiplier: 1.0
    auction:
      listing-fee: 0.0
      sale-fee-percent: 5.0
      expiry-days: 7
      max-active-listings: 10
      minimum-price: 0.01
      maximum-price: 2124000000.0
  hardcore:
    description: "Higher shop buy prices, lower sell returns, and tighter auction limits."
    catalog: standard
    buy-price-multiplier: 1.5
    sell-price-multiplier: 0.65
    auction:
      listing-fee: 5.0
      sale-fee-percent: 10.0
      expiry-days: 3
      max-active-listings: 5
      minimum-price: 1.0
      maximum-price: 100000000.0
  generous:
    description: "Lower shop buy prices, higher sell returns, and relaxed auction limits."
    catalog: standard
    buy-price-multiplier: 0.85
    sell-price-multiplier: 1.3
    auction:
      listing-fee: 0.0
      sale-fee-percent: 2.0
      expiry-days: 14
      max-active-listings: 20
      minimum-price: 0.01
      maximum-price: 2124000000.0

custom-presets: {}
