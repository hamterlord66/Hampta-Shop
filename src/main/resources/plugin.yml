name: HamptaShop
version: ${project.version}
main: com.hampta.shop.HamptaShopPlugin
api-version: '1.20'
description: A polished economy shop and player auction house.
author: hamterlord66
depend: [Vault]
softdepend: [PlaceholderAPI, LuckPerms]
commands:
  shop:
    description: Browse the Hampta Shop.
    usage: /shop [category|search|buy|sell|favorite|favorites|sort]
    aliases: [store]
  sell:
    description: Sell items to the server shop.
    usage: /sell <hand|all|hotbar|category|preview|confirm>
  ah:
    description: Browse and manage auction house listings.
    usage: /ah [search|sort|sell <price>|mine|cancel <id>|claim]
    aliases: [auction, auctionhouse]
  hamptashop:
    description: Hampta Shop administration.
    usage: /hamptashop <reload|preset|admin>
    aliases: [hs]
  ec:
    description: Open your ender chest.
    usage: /ec
  craft:
    description: Open a crafting table.
    usage: /craft
  anvil:
    description: Open an anvil.
    usage: /anvil
permissions:
  hamptashop.use:
    description: Use the shop and auction house.
    default: true
  hamptashop.sell:
    description: Sell items to the server shop.
    default: true
  hamptashop.auction:
    description: Create and manage auction listings.
    default: true
  hamptashop.admin:
    description: Full Hampta Shop administration access.
    default: op
  hamptashop.admin.reload:
    description: Reload Hampta Shop configuration files.
    default: op
  hamptashop.shop.edit:
    description: Add categories and manage server-shop items and prices.
    default: op
  hamptashop.preset.apply:
    description: Apply a saved economy preset.
    default: op
  hamptashop.preset.manage:
    description: Save and delete custom economy presets.
    default: op
  hamptashop.utility.enderchest:
    description: Open your ender chest with /ec.
    default: true
  hamptashop.utility.crafting:
    description: Open a virtual crafting table with /craft.
    default: true
  hamptashop.utility.anvil:
    description: Open a virtual anvil with /anvil.
    default: true
  hamptashop.ah.search:
    description: Search and sort auction listings.
    default: true
  hamptashop.ah.cancel:
    description: Cancel your own auction listings.
    default: true
